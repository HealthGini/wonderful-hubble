# ==============================================================================
# Render Production Blueprint for GoodDeeds.space + Resend Transactional Email
# Deploy via Render Dashboard -> New + -> Blueprint -> select this repository.
# ==============================================================================
services:
  - type: web
    name: gooddeeds-space
    runtime: python
    # Production Starter plan ($7/mo) enables 24/7 zero-sleep uptime + Persistent Disk
    # so SQLite WAL data survives every deploy and restart.
    # (For an ephemeral $0 preview, change `plan: free` and remove the `disk:` block.)
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /api/stats
    disk:
      name: gooddeeds-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Render injects PORT and RENDER_EXTERNAL_URL automatically.
      # Inside Render's isolated container network, bind 0.0.0.0 so the Render router reaches $PORT
      # (on bare-metal/VM behind Caddy, server.py defaults to 127.0.0.1 when HOST is unset):
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/gooddeeds.db
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,gooddeeds.space,www.gooddeeds.space
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      # Render prompts you securely for RESEND_API_KEY during Blueprint setup (never stored in Git):
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM_NAME
        value: GoodDeeds Community
      # Once gooddeeds.space DNS is verified in Resend, set to notifications@gooddeeds.space
      # (use onboarding@resend.dev if testing before domain DNS is verified):
      - key: SMTP_FROM_EMAIL
        value: notifications@gooddeeds.space
      - key: SUPPORT_ALERT_EMAIL
        value: support@gooddeeds.space
      # Dispatches emails in a background thread so HTTP responses stay <15ms:
      - key: EMAIL_ASYNC
        value: "true"
      # Populates rich showcase Spaces, Kudos & Posts idempotently on first boot:
      - key: SEED_SHOWCASE_DATA
        value: "true"
      # Optional: set PUBLIC_BASE_URL=https://gooddeeds.space once custom domain DNS is live
      # (until set, GoodDeeds.space automatically uses RENDER_EXTERNAL_URL / request Host):
      - key: PUBLIC_BASE_URL
        value: ""
    autoDeploy: true
